name: Deploy to GitHub Pages

# Builds the static site and publishes it to Pages on every push to main.
# The Vite build uses relative asset paths, so the project sub-path that Pages
# serves from (https://<user>.github.io/<repo>/) needs no extra configuration.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Turns Pages on for the repository the first time this runs, so there is
      # no manual settings step before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The solver checks run here too: a bad stamp should stop the deploy.
      - run: npm run check
      - run: npm run build:single
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
