<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Resolve the theme before first paint so a light-mode visitor never sees
         a dark flash: URL override, then the saved choice, then the OS. -->
    <script>
      (function () {
        var t = (/[#&?]theme=(light|dark)/.exec(location.hash + location.search) || [])[1];
        if (!t) { try { t = localStorage.getItem('circuit-lab.theme'); } catch (e) {} }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="IMaC Lab이 만든 교육용 실시간 회로 시뮬레이터. 브라우저에서 바로 회로를 그리고, 전압은 색으로, 전류는 흐르는 점으로 확인합니다." />
    <meta name="author" content="IMaC Lab" />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IMaC Lab" />
    <meta property="og:title" content="회로랩 — IMaC Lab 실시간 회로 시뮬레이터" />
    <meta property="og:description" content="설치 없이 브라우저에서 바로 돌려보는 회로 시뮬레이터. 전압은 색으로, 전류는 흐르는 점으로." />
    <meta property="og:url" content="https://imaclab-git.github.io/circuit_simulation/" />

    <title>회로랩 — IMaC Lab 실시간 회로 시뮬레이터</title>
